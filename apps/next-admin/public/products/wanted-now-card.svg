<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <!-- Wood grain border gradient -->
    <linearGradient id="woodBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="50%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#271003" />
    </linearGradient>
    <!-- Chalkboard background gradient -->
    <radialGradient id="chalkboardBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <!-- Gold accent gradient -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <!-- Red alert gradient -->
    <linearGradient id="alertRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
  </defs>

  <!-- Outer Wooden Frame -->
  <rect width="1080" height="1350" fill="url(#woodBorder)" />
  <rect x="36" y="36" width="1008" height="1278" rx="16" fill="#1C1917" stroke="#92400E" stroke-width="8" />

  <!-- Inner Chalkboard Surface -->
  <rect x="56" y="56" width="968" height="1238" rx="12" fill="url(#chalkboardBg)" stroke="#334155" stroke-width="3" stroke-dasharray="12 6" />

  <!-- Corner Brackets -->
  <path d="M 80 120 L 80 80 L 120 80" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 1000 120 L 1000 80 L 960 80" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 1230 L 80 1270 L 120 1270" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 1000 1230 L 1000 1270 L 960 1270" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />

  <!-- Top Badge: NEIGHBORHOOD HARVEST DEMAND -->
  <rect x="240" y="130" width="600" height="64" rx="32" fill="url(#alertRed)" />
  <text x="540" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    🚨 NEIGHBORHOOD DEMAND ALERT
  </text>

  <!-- Main Headline: WANTED NOW -->
  <text x="540" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="110" font-weight="950" fill="url(#goldAccent)" text-anchor="middle" letter-spacing="8">
    WANTED NOW
  </text>

  <!-- Subheadline -->
  <text x="540" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    FRESH GARDEN PRODUCE
  </text>

  <!-- Divider Ribbon -->
  <line x1="200" y1="490" x2="880" y2="490" stroke="#F59E0B" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Produce Icons & Demand Focus Box -->
  <rect x="140" y="540" width="800" height="340" rx="20" fill="rgba(15, 23, 42, 0.7)" stroke="#475569" stroke-width="2" />
  
  <text x="540" y="620" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#38BDF8" text-anchor="middle">
    🍋 MEYER LEMONS • 🍅 TOMATOES
  </text>
  <text x="540" y="680" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#4ADE80" text-anchor="middle">
    🥑 AVOCADOS • 🌿 FRESH HERBS
  </text>

  <text x="540" y="780" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#CBD5E1" text-anchor="middle">
    Local buyers are waiting to purchase your excess backyard harvest!
  </text>
  <text x="540" y="830" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#FDE047" text-anchor="middle">
    💰 Earn cash directly from neighbors in your ZIP
  </text>

  <!-- Big Action Button Box -->
  <rect x="200" y="960" width="680" height="110" rx="55" fill="#15803D" stroke="#86EFAC" stroke-width="4" />
  <text x="540" y="1028" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    LIST HARVEST ON CASAGROWN
  </text>

  <!-- Footer Info -->
  <text x="540" y="1160" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#94A3B8" text-anchor="middle">
    🌱 100% Free to List • Pickup from Your Porch • No Commission Fees
  </text>
  <text x="540" y="1210" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#E2E8F0" text-anchor="middle">
    casagrown.com
  </text>
</svg>
