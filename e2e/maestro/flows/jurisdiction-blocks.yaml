# Jurisdiction Blocks Flow — Maestro E2E test
# Verifies: Globally blocked products are FILTERED from the feed.
# The get_filtered_feed RPC excludes posts whose produce_name matches
# a globally blocked entry in blocked_products (all jurisdiction columns NULL).
# The create_order_atomic function provides a backup check at order time.
#
# Requires: Tobacco post + blocked_products entry in seed.sql.
# Must login as BUYER since sellers see their own posts regardless.

appId: dev.casagrown.community

---

# First login as seller (ensures app is running and on a known screen)
- runFlow: ../utils/login.yaml

# Sign out current user (seller) so we can login as buyer
- tapOn:
          text: ".*Menu.*"
- scrollUntilVisible:
          element: ".*Sign Out.*"
          direction: DOWN
          timeout: 15000
- tapOn: ".*Sign Out.*"
- extendedWaitUntil:
          visible: ".*Are you sure.*"
          timeout: 5000
- tapOn:
          text: "(?i)sign.out"
          index: 1
- extendedWaitUntil:
          visible: ".*(?:Join the Movement|Welcome to CasaGrown).*"
          timeout: 15000

# Login as buyer
- runFlow: ../utils/login-buyer.yaml

# Navigate to Feed tab explicitly (prior flows may leave on different tab)
- extendedWaitUntil:
          visible: ".*(?:Create Post|Feed|Chats|Orders|Offers|Menu).*"
          timeout: 15000
- tapOn:
          text: "Feed"
          index: 0
- extendedWaitUntil:
          visible: "Create Post"
          timeout: 10000

# Dismiss push notification prompt if shown
- tapOn:
          text: "Not now"
          optional: true

# ── Verify blocked product is NOT in feed ──
# The Tobacco post exists in the database but should be filtered out
# by get_filtered_feed RPC because it's globally blocked.
# First scroll through the feed to ensure it's fully loaded,
# then assert Tobacco is not visible.

# Scroll through the feed to make sure all posts are loaded
- scrollUntilVisible:
          element: "Tomatoes"
          direction: DOWN
          timeout: 15000

# Assert Tobacco is NOT visible in the feed
# (get_filtered_feed filters globally blocked products)
- assertNotVisible:
          text: ".*Tobacco.*"

# Scroll down more to double-check Tobacco doesn't appear further
- swipe:
          direction: UP
          duration: 400
- swipe:
          direction: UP
          duration: 400
- swipe:
          direction: UP
          duration: 400

# Final assertion: Tobacco must still not be visible after scrolling
- assertNotVisible:
          text: ".*Tobacco.*"

# Clean up — stop app and re-login as seller for subsequent tests
- stopApp:
          appId: dev.casagrown.community
- runFlow: ../utils/login.yaml
