# Hamburger Menu Flow — Maestro E2E test
# Tests the native Menu screen items and navigation.
# Validates Profile link goes to Profile screen.

appId: dev.casagrown.community

---

# Login first
- runFlow: ../utils/login.yaml

# Wait for app to fully load (may show feed, profile, or any screen)
- extendedWaitUntil:
          visible:
                  text: ".*(?:Create Post|Profile|Feed|Menu|Chats|Orders|Offers|Settings).*"
          timeout: 15000

# If on Profile Settings (stacked screen), press back to return to tabs
- runFlow:
          when:
                  visible: "Profile Settings"
          commands:
                  - back

# Navigate to feed first to ensure bottom tabs are visible
- extendedWaitUntil:
          visible:
                  text: ".*(?:Feed|Menu|Chats|Orders|Offers).*"
          timeout: 10000

# Open Menu via bottom tab
- tapOn:
          text: ".*Menu.*"

# ── Verify menu items are visible ──
# Use scrollUntilVisible instead of bare assertVisible since menu
# items may render incrementally and may need scrolling on small screens.
- extendedWaitUntil:
          visible:
                  text: ".*Profile.*Settings.*"
          timeout: 10000
- scrollUntilVisible:
          element: ".*Redeem Points.*"
          direction: DOWN
          timeout: 10000
- scrollUntilVisible:
          element: ".*Buy Points.*"
          direction: DOWN
          timeout: 10000
- scrollUntilVisible:
          element: ".*Transaction History.*"
          direction: DOWN
          timeout: 10000
- scrollUntilVisible:
          element: ".*Refund Points.*"
          direction: DOWN
          timeout: 10000

# ── Verify Transfer Points is NOT visible ──
- assertNotVisible:
          text: ".*Transfer Points.*"

# ── Navigate to Profile (critical regression test) ──
- scrollUntilVisible:
          element: ".*Profile.*Settings.*"
          direction: UP
          timeout: 10000
- tapOn:
          text: ".*Profile.*Settings.*"

# Verify we arrive at Profile screen
- extendedWaitUntil:
          visible:
                  text: ".*Profile.*"
          timeout: 10000

# The profile screen may show a CommunityMap render error.
# Dismiss it if present, then verify profile elements.
- runFlow:
          when:
                  visible: "Dismiss"
          commands:
                  - tapOn: "Dismiss"

# Verify profile elements visible (after dismissing any error)
- runFlow:
          when:
                  visible:
                          id: "profile-name"
          commands:
                  - assertVisible:
                            id: "profile-name"

# Go back from Profile Settings to return to Menu tab
- back
- extendedWaitUntil:
          visible:
                  text: ".*(?:Feed|Menu|Chats|Orders|Offers).*"
          timeout: 10000

# Open Menu tab again
- tapOn:
          text: ".*Menu.*"

# ── Scroll to community items ──
- extendedWaitUntil:
          visible:
                  text: ".*Profile.*Settings.*"
          timeout: 10000
- scrollUntilVisible:
          element: "Invite Friends"
          direction: DOWN
          timeout: 10000
- assertVisible:
          text: ".*Invite Friends.*"

# Scroll to Sign Out
- scrollUntilVisible:
          element: "Sign Out"
          direction: DOWN
          timeout: 15000
- assertVisible: "Sign Out"

# ── Navigate to Buy Points ──
- scrollUntilVisible:
          element:
                  text: ".*Buy Points.*"
          direction: UP
          timeout: 10000
- tapOn:
          text: ".*Buy Points.*"

# Verify we navigated to buy points
- extendedWaitUntil:
          visible:
                  text: ".*Points.*"
          timeout: 10000
