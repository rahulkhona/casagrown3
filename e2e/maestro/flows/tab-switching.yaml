# Tab Switching & Presence Flow — Maestro E2E test
# Tests rapid tab switching and verifies all tabs load correctly.
# Originally .maestro/05_chat_presence_flow.yaml

appId: dev.casagrown.community

---

# Login first
- runFlow: ../utils/login.yaml

# Wait for feed to load
- extendedWaitUntil:
    visible: "Create Post"
    timeout: 15000

# Navigate to Offers tab
- tapOn: ".*Offers.*"
- extendedWaitUntil:
    visible: ".*Offers.*|.*No offers.*"
    timeout: 15000
- assertVisible: ".*pts.*"

# Rapid tab switching — verify each tab loads
- tapOn: ".*Feed.*"
- extendedWaitUntil:
    visible: ".*Search.*|.*Feed.*"
    timeout: 5000
- tapOn: ".*Chats.*"
- extendedWaitUntil:
    visible: ".*Chats.*|.*No conversations.*"
    timeout: 5000
- tapOn: ".*Orders.*"
- extendedWaitUntil:
    visible: ".*Orders.*|.*No orders.*"
    timeout: 5000
- tapOn: ".*Offers.*"
- extendedWaitUntil:
    visible: ".*Offers.*|.*No offers.*"
    timeout: 5000
- tapOn: ".*Menu.*"
- extendedWaitUntil:
    visible: ".*Profile.*Settings.*|.*Sign Out.*"
    timeout: 5000
- tapOn: ".*Feed.*"
- extendedWaitUntil:
    visible: ".*Search.*|.*Feed.*"
    timeout: 5000
