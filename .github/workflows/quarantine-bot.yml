name: Quarantine Bot Sync

on:
  schedule:
    # Run at 14:00, 18:00, and 22:00 UTC (approx 10am, 2pm, 6pm EST)
    # on weekdays (Monday - Friday)
    - cron: '0 14,18,22 * * 1-5'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync_quarantines:
    name: Sync Agricultural Quarantines
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Quarantine Bot
        working-directory: apps/quarantine-bot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: yarn start
